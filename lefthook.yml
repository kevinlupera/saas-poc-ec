# Git hooks (lefthook). Backend only: they run when backend files change.
# Skip once with LEFTHOOK=0 git commit ...; CI must still run `pnpm check` and `pnpm test`.
# doublestar: `dir/**/*` also matches files directly in `dir` (the default matcher skips them).
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    boundaries:
      glob: "{packages/core,packages/auth,packages/db,apps/api,scripts}/**/*"
      run: pnpm check:boundaries
    api-contract:
      glob: "{apps/api/server/api,apps/api/server/mcp/tools,scripts}/**/*"
      run: pnpm check:api

commit-msg:
  commands:
    conventional:
      run: |
        # Messages git writes itself (merge, revert, fixup/squash) are allowed as-is.
        head -1 {1} | grep -Eq '^(Merge |Revert "|fixup! |squash! |amend! )' && exit 0
        head -1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' \
          || { echo "commit message must follow Conventional Commits (type(scope): subject)"; exit 1; }
    no-ai-attribution:
      run: |
        ! grep -Eqi '^(co-authored-by|claude-session):' {1} \
          || { echo "remove Co-Authored-By / AI attribution lines (project rule)"; exit 1; }

pre-push:
  commands:
    check:
      glob: "{packages,apps,scripts}/**/*"
      run: pnpm check
    test:
      glob: "{packages,apps,scripts}/**/*"
      run: pnpm test
