services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Dev/test mail catcher: SMTP on 1025, UI and REST API on 8025. Mail is disposable (no volume).
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '1025:1025'
      - '8025:8025'
volumes:
  pgdata:
